[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel_token_contradiction"
version = "0.1.0"
description = "Kernel Token Contradiction: a Fast and Principled Approach for LLM Claim Uncertainty Quantification"
readme = "README.md"
requires-python = "==3.12.0"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jeremie Dentan"},
    {name = "Alexi Canesse"},
    {name = "Mahammed El Sharkawy"},
    {name = "Sonia Vanier"}
]

dependencies = [
    "torch==2.7.1",
    "numpy==2.3.0",
    "typer==0.16.0",
    "python-dotenv==1.1.0",
    "datasets==3.6.0",
    "accelerate==1.7.0",
    "transformers==4.52.4",
    "loguru==0.7.3",
    "pre-commit==4.2.0",
    "python-decouple==3.8",
    "pydantic==2.11.7",
    "tqdm==4.67.1",
    "matplotlib==3.10.3",
    "scipy==1.16.0",
    "scikit-learn==1.7.0",
    "nltk==3.9.1",
    "openai==1.97.0",
    "tiktoken==0.9.0",
    "wikipedia==1.4.0",
    "diskcache==5.6.3",
    "wptools==0.4.17",
    "sentence-transformers==5.1.1",
    "much-segmenter==0.2.1",
    "notebook==7.4.3",
    "ipywidgets==8.1.7",
    "sentencepiece==0.2.1",
    "line_profiler==5.0.1",
    "matplot2tikz==0.5.4",
]
